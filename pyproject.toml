[project]
name = "i3-cua-mcp"
version = "0.1.0"
description = "i3-aware computer-use MCP server for X11 — screenshot + click/type + i3 tree targeting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "i3ipc>=2.2",
    "pillow>=10",
]

[project.scripts]
i3-cua-mcp = "i3_cua_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/i3_cua_mcp"]
